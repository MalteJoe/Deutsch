name: Pebble Build and Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ARM toolchain
        run: |
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Pebble tool and SDK
        run: |
          uv tool install pebble-tool
          pebble sdk install 4.33.1

      - name: Build Pebble app
        run: |
          pebble build

      - name: Upload PBW artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurz-vor-acht
          path: build/kurz-vor-acht.pbw

      - name: Create GitHub Release on push with tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/kurz-vor-acht.pbw
          draft: true
          prerelease: false
          generate_release_notes: true
