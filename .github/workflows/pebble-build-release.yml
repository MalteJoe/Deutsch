name: Pebble Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Pebble tool
        run: |
          uv tool install pebble-tool
      
      - name: Install ARM toolchain
        run: |
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build Pebble app
        run: |
          pebble build

      - name: Upload PBW artifact
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-pbw
          path: build/Deutsch.pbw

      - name: Create GitHub Release on push with tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Deutsch.pbw
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload release artifact for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-pbw-manual
          path: build/Deutsch.pbw
