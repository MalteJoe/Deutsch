<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Einstellungen</title>
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
    <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>
  </head>

  <body>
    <div data-role="page" id="main">
      <div data-role="header" class="jqm-header">
        <h1>Einstellungen</h1>
      </div>

      <div data-role="content">

        <div class="ui-body ui-body-b">
          <fieldset class="ui-grid-a">
            <div class="ui-block-a"><button type="submit" data-theme="d" id="b-cancel">Cancel</button></div>
            <div class="ui-block-b"><button type="submit" data-theme="a" id="b-submit">Submit</button></div>
          </fieldset>
        </div>

        <div data-role="fieldcontain">
          <label for="KEY_THEME">Farbschema</label>
          <select name="KEY_THEME" id="KEY_THEME">
            <option value="0">Schwarz/wei&szlig;</option>
            <option value="1">Blau</option>
            <option value="2">Grün</option>
            <option value="3">Rot</option>
            <option value="4">Grau</option>
            <option value="5">Weiß</option>
          </select>
        </div>

        <div data-role="fieldcontain">
          <label for="KEY_TEXT_ALIGN">Textausrichtung (Für runde Displays immer mittig)</label>
          <select name="KEY_TEXT_ALIGN" id="KEY_TEXT_ALIGN">
            <option value="0">Links</option>
            <option value="1">Mittig</option>
            <option value="2">Rechts</option>
          </select>
        </div>

        <div data-role="fieldcontain">
          <label for="KEY_FUZZY">Fuzzy-Modus (Uhrzeit umgangssprachlich)</label>
          <select name="KEY_FUZZY" id="KEY_FUZZY" data-role="slider">
            <option value="off">Nein</option>
            <option value="on">Ja</option>
          </select>
        </div>
        
        <div data-role="fieldcontain">
          <label for="KEY_TEXT_WIEN">"Viertel Elf" f&uuml;r 10:15</label>
          <select name="KEY_TEXT_WIEN" id="KEY_TEXT_WIEN" data-role="slider">
            <option value="off">Nein</option>
            <option value="on">Ja</option>
          </select>
        </div>

        <div data-role="fieldcontain">
          <label for="KEY_TEXT_NRW">"Viertel vor Elf" f&uuml;r 10:45</label>
          <select name="KEY_TEXT_NRW" id="KEY_TEXT_NRW" data-role="slider">
            <option value="off">Nein</option>
            <option value="on">Ja</option>
          </select>
        </div>

        <div data-role="fieldcontain">
          <label for="KEY_DATE">Datum anzeigen</label>
          <select name="KEY_DATE" id="KEY_DATE" data-role="slider">
            <option value="off">Nein</option>
            <option value="on">Ja</option>
          </select>
        </div>

        <div data-role="fieldcontain">
          <label for="KEY_BATT_IMG">Batteriestatus anzeigen</label>
          <select name="KEY_BATT_IMG" id="KEY_BATT_IMG">
            <option value="0">Nie</option>
            <option value="1">Wenn unter 10%</option>
            <option value="2">Immer</option>
          </select>
        </div>
        
        <div data-role="fieldcontain">
          <label for="KEY_BLUETOOTH">Bluetooth-Icon anzeigen</label>
          <select name="KEY_BLUETOOTH" id="KEY_BLUETOOTH">
            <option value="0">Nie</option>
            <option value="1">Wenn nicht verbunden</option>
            <option value="2">Immer</option>
          </select>
        </div>

        <div data-role="fieldcontain">
          <label for="KEY_VIBE">Vibrieren bei Bluetooth-Verlust</label>
          <select name="KEY_VIBE" id="KEY_VIBE" data-role="slider">
            <option value="off">Nein</option>
            <option value="on">Ja</option>
          </select>
        </div>

      </div>
    </div>

    <script>
      function saveOptions() {
        var options = {
          'KEY_FUZZY':      "on" == $("#KEY_FUZZY").val(),
          'KEY_BLUETOOTH':  Number( $("#KEY_BLUETOOTH").val()),
          'KEY_VIBE':       "on" == $("#KEY_VIBE").val(),
          'KEY_BATT_IMG':   Number( $("#KEY_BATT_IMG").val()),
          'KEY_TEXT_NRW':   "on" == $("#KEY_TEXT_NRW").val(),
          'KEY_TEXT_WIEN':  "on" == $("#KEY_TEXT_WIEN").val(),
          'KEY_DATE':       "on" == $("#KEY_DATE").val(),
          'KEY_THEME':      Number( $("#KEY_THEME").val()),
          'KEY_TEXT_ALIGN': Number( $("#KEY_TEXT_ALIGN").val()),
        }
        return options;
      }

      function getUrlOptions() {
        var params = {};
        var bits = window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/g, function (match, key, value) {
          params[key] = value;
        });
        return params;
      }

      function setUrlOptions() {
        var params = getUrlOptions();
        for (key in params) {
          var field = $("#"+key);
          if (field !== null) {
            var value = decodeURIComponent(params[key]);
            if (key=='KEY_THEME' || key=='KEY_TEXT_ALIGN' || key=='KEY_BLUETOOTH' || key=='KEY_BATT_IMG') {
              $("#"+key).val(value);
              $("#"+key).selectmenu("refresh");
            } else {
              field.val("true" == value ? "on" : "off").slider("refresh");
            }
          }
        }
      }

      $().ready(function() {
        setUrlOptions();
        const params = new URLSearchParams(window.location.search);
        // return_to is provided by CloudPebble/Emulator; Mobile Pebble App intercepts the pebblejs protocol
        const return_to = params.get("return_to") ?? "pebblejs://close#"

        $("#b-cancel").click(function() {
          console.log("Cancel");
          document.location = return_to;
        });

        $("#b-submit").click(function() {
          console.log("Submit");

          var location = return_to + encodeURIComponent(JSON.stringify(saveOptions()));
          console.log("Warping to: " + location);
          document.location = location;
        });
      });
    </script>
  </body>
</html>
